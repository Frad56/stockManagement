<mat-card class="product-card">

    <mat-card-title>Product List</mat-card-title>
  
   
    <div class="Add-button">
      
      <button mat-raised-button color="primary" (click)="addProduct()">
        Add Product
      </button>
      <button mat-raised-button color="primary" (click)="goBack()">
        Back
      </button>
    </div>
    <table mat-table [dataSource]="(products$ | async) || []" class="mat-elevation-z8">
  
      <!-- ID -->
      <ng-container matColumnDef="product_id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let product"> {{product.productId}} </td>
      </ng-container>
  
      <!-- Reference -->
      <ng-container matColumnDef="reference">
        <th mat-header-cell *matHeaderCellDef> Reference </th>
        <td mat-cell *matCellDef="let product"> {{product.reference}} </td>
      </ng-container>
  
      <!-- Designation -->
      <ng-container matColumnDef="designation">
        <th mat-header-cell *matHeaderCellDef> Designation </th>
        <td mat-cell *matCellDef="let product"> {{product.designation}} </td>
      </ng-container>
  
      <!-- Brand -->
      <ng-container matColumnDef="brand">
        <th mat-header-cell *matHeaderCellDef> Brand </th>
        <td mat-cell *matCellDef="let product"> {{product.brand}} </td>
      </ng-container>
  
      <!-- Description -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let product"> {{product.description}} </td>
      </ng-container>
  
      <!-- Price -->
      <ng-container matColumnDef="basePrice">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let product"> {{product.basePrice}} </td>
      </ng-container>
      
      <!-- Category -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> category  </th>
        <td mat-cell *matCellDef="let product"> {{product.category.name}} </td>
      </ng-container>

         <!-- La place selon l'etage/aisle -->
         <ng-container matColumnDef="aisle">
          <th mat-header-cell *matHeaderCellDef> Place </th>
          <td mat-cell *matCellDef="let product" > {{product.aisle.name}} </td>
        </ng-container>
      
  
      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let product">
          <button mat-raised-button color="primary" (click)=" addProductUnitsale(product.productId)">
            Add Product Unit sale
          </button>
          <!-- Edit -->
          <button mat-icon-button matTooltip="Edit" class="btn-edit" (click)="editProduct(product.productId)">
            <img src="https://cdn-icons-png.flaticon.com/512/764/764599.png" alt="edit" width="20" height="20">
          </button>
      
          <!-- Delete -->
          <button mat-icon-button matTooltip="Delete" class="btn-delete" (click)="deleteProduct(product.productId)">
            <img src="https://cdn-icons-png.flaticon.com/512/3096/3096673.png" alt="delete" width="20" height="20">
          </button>
      
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  
  </mat-card>

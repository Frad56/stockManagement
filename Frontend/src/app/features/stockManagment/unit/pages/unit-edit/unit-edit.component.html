
<h2 class="title"> edit unit  </h2>

<div class="form-container">
  <form [formGroup]="unitForm" (ngSubmit)="onSubmit()" class="product-supplier-form">

    
    <mat-form-field>
      <mat-label>unit Name</mat-label>
      <mat-select formControlName="name">
        <mat-option *ngFor="let unitName of unitNames"
        [value]="unitName">    {{ unitName }}</mat-option>
      </mat-select>
  </mat-form-field>


    <div class="button-group">
      <button mat-raised-button class="Create-button" color="primary" type="submit">
        Update
      </button>

      <button type="button"
              class="back-button"
              mat-raised-button
              color="primary"
              (click)="goBack()">
        Back
      </button>
    </div>

  </form>
</div>
